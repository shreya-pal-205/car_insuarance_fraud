<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insurance Fraud Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* GLOBAL FIXES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #f3f7ff;
            color: white;
            overflow-x: hidden; /* prevent horizontal scroll */
        }

        /* NAVBAR */
        nav {
            width: 100%;
            background: rgba(0, 38, 84, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: fixed;
            top: 0;
            z-index: 10;
            flex-wrap: wrap;
        }

        nav h2 {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.2rem;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .nav-links a {
            color: #bcd8ff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* HERO SECTION */
        .hero {
            min-height: 100vh;
            width: 100%;
            background:
                linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px 40px 20px; /* top padding for fixed navbar */
        }

        .hero h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffffff;
            max-width: 900px;
            line-height: 1.3;
        }

        .hero p {
            font-size: 1.1rem;
            margin-top: 15px;
            color: #dbe8ff;
            max-width: 700px;
            font-weight: 500;
        }

        .btn {
            margin-top: 30px;
            background: #1e74ff;
            padding: 14px 32px;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 30px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background: #0b5ad9;
            transform: translateY(-2px);
        }

        /* RESPONSIVE TYPOGRAPHY */
        @media screen and (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            .hero p {
                font-size: 1rem;
            }
            nav h2 {
                font-size: 1rem;
            }
            .nav-links a {
                margin-left: 10px;
                font-size: 0.9rem;
            }
        }

        @media screen and (max-width: 480px) {
            .hero h1 {
                font-size: 1.6rem;
            }
            .hero p {
                font-size: 0.95rem;
            }
            .btn {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <nav>
        <h2>🚗 Car Insurance Fraud Detection</h2>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/guidelines">Guidelines</a>
            <a href="/predict">Try Prediction</a>
        </div>
    </nav>

    <section class="hero">
        <h1>🔍 Detect Insurance Fraud Using AI
            <br> <span style="color:#8ecbff;">Fast. Accurate. Reliable.</span>
        </h1>

        <p>
            🚘 Our intelligent system analyzes claims and flags suspicious activities
            ensuring fair, safe, and transparent insurance processing.
        </p>

        <a href="/predict" class="btn">Start Detection ⚡</a>
    </section>
</body>
</html>
