<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fraud Detection Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { box-sizing: border-box; margin:0; padding:0; }

        body {
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            background: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
            position: relative;
        }

        /* Dark overlay */
        body::before {
            content: '';
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.65);
            z-index: -1;
        }

        /* Navbar */
        nav {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,38,84,0.95);
            position: fixed;
            top: 0;
            z-index: 10;
            flex-wrap: wrap;
        }

        nav a {
            color: #bcd8ff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Form Section */
        .form-section {
            max-width: 500px;
            margin: 140px auto 60px auto; /* leave space for navbar */
            padding: 25px 30px;
            background: rgba(0,0,0,0.55);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .form-section h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 2rem;
            font-weight: 800;
            color: #7FDBFF; /* light blue */
        }

        .form-section form {
            display: flex;
            flex-direction: column;
        }

        .form-section label {
            font-weight: 600;
            margin-bottom: 5px;
            margin-top: 12px;
            color: #e0e7ff;
        }

        .form-section input {
            padding: 10px 15px;
            border-radius: 25px;
            border: 2px solid #FF7A30;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .form-section button {
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 25px;
            background: #FF7A30;
            color: #fff;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-section button:hover {
            background: #e06600;
        }

        .result {
            margin-top: 20px;
            padding: 12px 15px;
            text-align: center;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .result.fraud {
            background: #FF4D4D;
            color: #fff;
        }

        .result.genuine {
            background: #4CAF50;
            color: #fff;
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .form-section { margin: 160px 20px 60px 20px; padding: 20px; }
        }
        @media screen and (max-width: 480px) {
            nav a { margin: 5px 10px; font-size: 0.9rem; }
            .form-section { margin: 180px 15px 40px 15px; padding: 15px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/">🏠 Home</a>
        <a href="/about">ℹ️ About</a>
        <a href="/guidelines">📜 Guidelines</a>
        <a href="/predict">🔍 Predict</a>
    </nav>

    <section class="form-section">
        <h1>🚗 Car Insurance Claim Details</h1>
        <form action="/predict_result" method="post">
            <label>Age:</label><input type="number" name="AGE" required>
            <label>Income:</label><input type="number" name="INCOME" required>
            <label>Home Value:</label><input type="number" name="HOME_VAL" required>
            <label>Car Age:</label><input type="number" name="CAR_AGE" required>
            <label>Old Claim Amount:</label><input type="number" name="OLDCLAIM" required>
            <label>Claim Amount:</label><input type="number" name="CLM_AMT" required>
            <label>Motor Violation Points:</label><input type="number" name="MVR_PTS" required>
            <button type="submit">Predict Fraud</button>
        </form>

        {% if result %}
            <div class="result {{ color }}">{{ result }}</div>
        {% endif %}
    </section>

</body>
</html>
